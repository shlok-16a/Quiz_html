<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c0c0c">
    <title>Quiz — 16Arena</title>
    <link rel="stylesheet" href="css/style.css?v=20260814c">
</head>
<body>

<div class="brand">
    <img src="assets/img/logo.svg" alt="16Arena" class="brand-logo">
    <span class="brand-tag">Quiz</span>
</div>

<div id="arenaBoot" class="boot">
    <div class="boot-spinner"></div>
    <p id="arenaBootMsg" class="muted">Connecting to Arena…</p>
    <p id="standaloneLoginLink" class="faint" style="margin-top:26px; font-size:13px; display:none;">
        <a href="?standalone=1">Standalone login</a> · browser only
    </p>
</div>

<div id="playReady" class="play-ready" style="display:none;">
    <div class="panel ar-rise" style="padding:26px 20px; text-align:center;">
        <h2 id="playReadyTitle" style="margin:0 0 10px;">Welcome to Quiz</h2>

        <div id="playReadyRulesBlock" style="display:none; margin:0 0 16px; text-align:left;">
            <span class="eyebrow">Rules</span>
            <p id="playReadyRules" class="muted" style="white-space:pre-wrap; font-size:13.5px; margin-top:6px;"></p>
        </div>

        <p id="playReadyScoring" class="muted" style="text-align:left; font-size:13.5px; line-height:1.55; margin:0 0 22px; white-space:pre-wrap;"></p>
        <button type="button" id="playStartBtn" onclick="onPoolPlayStart()">Start quiz</button>
        <p id="playReadyError" class="quiz-violation" style="margin:16px 0 0; display:none;"></p>
    </div>
</div>

<div id="startCountdownOverlay" class="modal-overlay countdown-overlay" aria-live="polite">
    <div class="countdown-card">
        <p class="eyebrow" style="margin-bottom:10px;">Get ready</p>
        <div id="startCountdownNumber" class="countdown-number">5</div>
        <p class="muted" style="margin-top:10px;">Quiz starts soon…</p>
    </div>
</div>

<div id="authForm" style="display:none;">
    <div class="panel">
        <span class="eyebrow">Standalone access</span>
        <h2 style="margin:10px 0 20px;">Sign in</h2>

        <label for="email">Email</label>
        <input id="email" placeholder="you@example.com" type="email" autocomplete="username">

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Minimum 6 characters" autocomplete="current-password">

        <button type="button" class="primary" onclick="submitAuth()">Log in</button>

        <p class="faint" style="font-size:12.5px; margin-top:16px;">
            Browser only. Inside the Arena app the injected JWT is used — no login screen.
        </p>
    </div>
</div>

<script src="js/arena_bridge.js?v=20260814c"></script>
<script src="js/flutter_session.js?v=20260814c"></script>
<script src="js/api.js?v=20260814c"></script>
<script src="js/auth.js?v=20260814c"></script>

</body>
</html>
