<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="css/style.css?v=20260812b">
</head>
<body>

<div id="arenaBoot" style="text-align:center; margin-top:64px; padding:0 24px;">
    <p id="arenaBootMsg" class="muted" style="font-size:16px;">Connecting to Arena…</p>
    <p id="standaloneLoginLink" class="muted" style="margin-top:28px; display:none;">
        <a href="?standalone=1">Standalone login</a> (browser only)
    </p>
</div>

<div id="playReady" class="play-ready" style="display:none;">
    <p class="muted" style="margin:0 0 6px;">Ready to play</p>
    <h2 id="playReadyTitle" style="margin:0 0 12px;">Quiz</h2>
    <p id="playReadyMeta" class="muted" style="margin:0 0 8px;"></p>
    <p id="playReadyHint" class="muted" style="margin:0 0 24px;">
        Tap Start when you’re ready. A 5-second countdown runs before the first question.
    </p>
    <button type="button" id="playStartBtn" onclick="onPoolPlayStart()">Start</button>
    <p id="playReadyError" class="muted" style="color:#dc2626; margin-top:16px; display:none;"></p>
</div>

<div id="startCountdownOverlay" class="modal-overlay countdown-overlay" style="display:none;" aria-live="polite">
    <div class="countdown-card">
        <p class="muted" style="margin:0 0 8px;">Get ready</p>
        <div id="startCountdownNumber" class="countdown-number">5</div>
        <p class="muted" style="margin:8px 0 0;">Quiz starts soon...</p>
    </div>
</div>

<div id="authForm" style="display:none;">
    <h2>Quiz Login</h2>

    <input id="email" placeholder="Email" type="email" autocomplete="username">
    <br><br>
    <input id="password" type="password" placeholder="Password (min 6)" autocomplete="current-password">
    <br><br>

    <button type="button" onclick="submitAuth()">Login</button>

    <p class="muted">Browser-only. In the Arena app, the existing JWT is used — no login.</p>
</div>

<script src="js/flutter_session.js?v=20260814a"></script>
<script src="js/api.js?v=20260814b"></script>
<script src="js/auth.js?v=20260814b"></script>

</body>
</html>
