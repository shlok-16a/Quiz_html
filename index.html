<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2 id="pageTitle">Quiz Login</h2>

<div id="registerFields" style="display:none;">
    <input id="fullName" placeholder="Full Name" autocomplete="name">
    <br><br>
</div>

<div id="credentialsFields">
    <input id="email" placeholder="Email" type="email" autocomplete="username">
    <br><br>
    <input id="password" type="password" placeholder="Password (min 6)" autocomplete="current-password">
    <br><br>
</div>

<div id="otpFields" style="display:none;">
    <input id="otp" placeholder="4-digit OTP" inputmode="numeric" maxlength="4" autocomplete="one-time-code">
    <br><br>
</div>

<button type="button" id="primaryBtn" onclick="submitAuth()">Login</button>

<p id="loginHint" class="muted">Player: use your registered email and password</p>

<p id="authSwitch" class="muted">
    <span id="authSwitchText">New player?</span>
    <a href="#" id="authSwitchLink" onclick="toggleAuthMode(event)">Register here</a>
</p>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
