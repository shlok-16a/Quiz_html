<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c0c0c">
    <title>Result — 16Arena</title>
    <link rel="stylesheet" href="css/style.css?v=20260817e">
</head>
<body>

    <div class="brand ar-rise">
        <img src="assets/img/logo.svg" alt="16Arena" class="brand-logo">
        <span class="brand-tag">Quiz</span>
    </div>

    <div class="result-hero ar-rise">
        <h2 id="gameOverTitle">Quiz Complete</h2>
        <span class="eyebrow" id="scoreLabel">Your Score</span>
        <h3 id="score">0</h3>
    </div>

    <p id="submitStatus" class="game-over-status" style="display:none;"></p>

    <div class="stat-grid ar-rise">
        <div class="hud-cell" id="correct">
            <span class="eyebrow">Correct</span>
            <span class="hud-value">0</span>
        </div>
        <div class="hud-cell" id="wrong">
            <span class="eyebrow">Wrong</span>
            <span class="hud-value">0</span>
        </div>
        <div class="hud-cell" id="skipped">
            <span class="eyebrow">Skipped</span>
            <span class="hud-value">0</span>
        </div>
        <div class="hud-cell" id="rank">
            <span class="eyebrow">Rank</span>
            <span class="hud-value">&ndash;</span>
        </div>
        <div class="hud-cell" id="percentage">
            <span class="eyebrow">Accuracy</span>
            <span class="hud-value">0%</span>
        </div>
        <div class="hud-cell" id="bonus">
            <span class="eyebrow">Speed bonus</span>
            <span class="hud-value">0</span>
        </div>
        <div class="hud-cell" id="duration">
            <span class="eyebrow">Time taken</span>
            <span class="hud-value">0s</span>
        </div>
    </div>

    <p id="violations" class="quiz-violation" style="display:none;"></p>

    <button type="button" id="backBtn" onclick="goBack()" style="display:none;">Back</button>

    <script src="js/arena_bridge.js?v=20260817e"></script>
    <script src="js/api.js?v=20260817e"></script>
    <script src="js/result.js?v=20260817e"></script>

</body>
</html>
