<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Quiz</title>
    <link rel="stylesheet" href="css/style.css?v=20260812b">
</head>
<body>

    <div class="row quiz-topbar" style="justify-content:space-between; align-items:center;">
        <h2 id="title" style="margin:0;">Quiz</h2>
        <div id="runningScore" class="quiz-running-score" aria-live="polite">Score: 0</div>
    </div>
    <p id="timer" class="muted"></p>
    <p id="progress"></p>
    <div id="questionMedia" class="quiz-media" hidden></div>
    <h3 id="question"></h3>

    <button type="button" id="option1"></button>
    <br><br>
    <button type="button" id="option2"></button>
    <br><br>
    <button type="button" id="option3"></button>
    <br><br>
    <button type="button" id="skipBtn">Skip</button>

    <p id="status" class="quiz-status" style="display:none;"></p>

    <div id="feedbackBanner" class="quiz-feedback-banner" role="status" aria-live="polite"></div>

    <div id="nextCountdownOverlay" class="modal-overlay countdown-overlay" style="display:none;" aria-live="polite">
        <div class="countdown-card">
            <p id="nextCountdownLabel" class="muted" style="margin:0 0 8px;">Next question loading in</p>
            <div id="nextCountdownNumber" class="countdown-number">5</div>
            <p id="nextCountdownHint" class="muted" style="margin:8px 0 0; display:none;">Quiz starts soon...</p>
        </div>
    </div>

    <script src="js/flutter_session.js?v=20260812b"></script>
    <script src="js/api.js?v=20260812e"></script>
    <script src="js/quiz.js?v=20260812e"></script>

</body>
</html>
