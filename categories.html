<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c0c0c">
    <title>Active Quizzes — 16Arena</title>
    <link rel="stylesheet" href="css/style.css?v=20260814c">
</head>
<body>

<div class="brand">
    <img src="assets/img/logo.svg" alt="16Arena" class="brand-logo">
    <span class="brand-tag">Quiz</span>
    <span style="flex:1;"></span>
    <button type="button" class="icon-btn" id="logoutBtn" onclick="userLogout()" aria-label="Log out">&#10005;</button>
</div>

<span class="eyebrow">Lobby</span>
<h2 style="margin:8px 0 6px;">Active quizzes</h2>
<p class="muted" style="font-size:13.5px; margin-bottom:20px;">
    Pick a quiz to enter. Only quizzes marked active by an admin appear here.
</p>

<div id="quizzes"></div>

<div id="quizStartModal" class="modal-overlay" onclick="onModalBackdrop(event)">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <span id="modalWelcome" class="eyebrow">Welcome to</span>
        <h3 id="modalTitle" style="margin:8px 0 16px;"></h3>

        <div id="modalRulesBlock" style="display:none; margin-bottom:16px;">
            <span class="eyebrow">Rules</span>
            <p id="modalRules" class="muted" style="white-space:pre-wrap; font-size:13.5px; margin-top:6px;"></p>
        </div>

        <div class="stat-grid" style="margin-bottom:20px;">
            <div class="hud-cell">
                <span class="eyebrow">Questions</span>
                <span class="hud-value" id="modalQuestions"></span>
            </div>
            <div class="hud-cell">
                <span class="eyebrow">Per question</span>
                <span class="hud-value" id="modalTimer"></span>
            </div>
            <div class="hud-cell">
                <span class="eyebrow">Correct</span>
                <span class="hud-value" id="modalCorrect"></span>
            </div>
            <div class="hud-cell">
                <span class="eyebrow">Wrong</span>
                <span class="hud-value" id="modalWrong"></span>
            </div>
            <div class="hud-cell span-2" id="modalBonusRow" style="display:none;">
                <span class="eyebrow">Speed bonus</span>
                <span class="hud-value" id="modalBonus"></span>
            </div>
        </div>

        <button type="button" id="modalOkBtn" onclick="confirmStartQuiz()" style="margin-bottom:9px;">Start quiz</button>
        <button type="button" class="secondary" id="modalCancelBtn" onclick="closeStartModal()">Cancel</button>
    </div>
</div>

<div id="countdownOverlay" class="modal-overlay countdown-overlay">
    <div class="countdown-card">
        <p class="eyebrow" style="margin-bottom:10px;">Get ready</p>
        <div id="countdownNumber" class="countdown-number">5</div>
        <p class="muted" style="margin-top:10px;">Quiz starts soon…</p>
    </div>
</div>

<script src="js/arena_bridge.js?v=20260814c"></script>
<script src="js/flutter_session.js?v=20260814c"></script>
<script src="js/api.js?v=20260814c"></script>
<script src="js/categories.js?v=20260814c"></script>

</body>
</html>
