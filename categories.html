<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Quizzes</title>
    <link rel="stylesheet" href="css/style.css?v=20260812b">
</head>
<body>

<h2>Active Quizzes</h2>
<button type="button" class="secondary" id="logoutBtn" onclick="userLogout()" style="float:right;">Logout</button>
<p class="muted">Only quizzes marked Active by admin are listed here.</p>

<div id="quizzes"></div>

<div id="quizStartModal" class="modal-overlay" style="display:none;" onclick="onModalBackdrop(event)">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalWelcome">
        <p id="modalWelcome" class="muted" style="margin-top:0;">Welcome to</p>
        <h2 id="modalTitle" style="margin-top:4px;"></h2>
        <div id="modalRulesBlock" style="display:none;">
            <p><strong>Rules</strong></p>
            <p id="modalRules" class="muted" style="white-space:pre-wrap;"></p>
        </div>
        <p><strong>Total questions:</strong> <span id="modalQuestions"></span></p>
        <p><strong>Correct points:</strong> <span id="modalCorrect"></span></p>
        <p><strong>Wrong points:</strong> <span id="modalWrong"></span></p>
        <p><strong>Seconds per question:</strong> <span id="modalTimer"></span></p>
        <p id="modalBonusRow" style="display:none;"><strong>Speed bonus:</strong> <span id="modalBonus"></span></p>
        <br>
        <div class="row">
            <button type="button" id="modalOkBtn" onclick="confirmStartQuiz()">Okay</button>
            <button type="button" class="secondary" id="modalCancelBtn" onclick="closeStartModal()">Cancel</button>
        </div>
    </div>
</div>

<div id="countdownOverlay" class="modal-overlay countdown-overlay" style="display:none;">
    <div class="countdown-card">
        <p class="muted" style="margin:0 0 8px;">Get ready</p>
        <div id="countdownNumber" class="countdown-number">5</div>
        <p class="muted" style="margin:8px 0 0;">Quiz starts soon...</p>
    </div>
</div>

<script src="js/flutter_session.js?v=20260814a"></script>
<script src="js/api.js?v=20260812b"></script>
<script src="js/categories.js?v=20260812b"></script>

</body>
</html>
